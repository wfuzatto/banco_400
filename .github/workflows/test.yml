name: Validar CNAB 400
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Conferir sintaxe da interface e configuração
        run: |
          node --check src/app.js
          node --check src/config.js
          node --check src/parser.js
          node --check src/layouts.js
      - name: Validar parser, banco fixo e posições
        run: node --test tests/*.test.mjs
